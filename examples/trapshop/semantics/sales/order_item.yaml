schema: mautoontology/v1
kind: entity
id: order_item
label: Order Item
description: One row per order line (product, quantity, unit price at order time).
domain: sales
entity_type: fact
source:
  dataset: order_items
grain: [order_id, line_no]
keys:
  primary: [order_id, line_no]
  unique:
    - [order_id, product_id]
attributes:
  - id: order_id
    role: identifier
    family: integer
    semantic_type: identifier
    nullable: false
  - id: line_no
    role: identifier
    family: integer
    semantic_type: identifier
    nullable: false
  - id: product_id
    role: identifier
    family: integer
    semantic_type: identifier
    nullable: false
  - id: quantity
    role: measure
    family: integer
    semantic_type: quantity
    aggregation: sum
    additivity: additive
    nullable: false
  - id: unit_price
    role: measure
    family: decimal
    semantic_type: price
    aggregation: avg
    additivity: non_additive
    nullable: false
    money:
      currency: EUR
relationships:
  - id: order_item__order
    to: order
    on:
      - from: order_id
        to: order_id
    cardinality: many_to_one
    optional: false
    status: approved
    origin: generated
    evidence:
      - kind: inclusion
        score: 1.0
        detail: 3000/3000 distinct values found in parent
      - kind: uniqueness
        ref: orders(order_id)
        score: 1.0
      - kind: name_match
        score: 0.9
        detail: exact key-name match
    reviewed_by: data-team
    reviewed_at: '2026-11-18'
  - id: order_item__product
    to: product
    on:
      - from: product_id
        to: product_id
    cardinality: many_to_one
    optional: false
    status: approved
    origin: generated
    evidence:
      - kind: inclusion
        score: 1.0
        detail: 120/120 distinct values found in parent
      - kind: uniqueness
        ref: products(product_id)
        score: 1.0
      - kind: name_match
        score: 0.9
        detail: exact key-name match
    reviewed_by: data-team
    reviewed_at: '2026-11-18'
status: approved
origin: generated
evidence:
  - kind: uniqueness
    ref: order_items(order_id, line_no)
    score: 1.0
reviewed_by: data-team
reviewed_at: '2026-11-18'
