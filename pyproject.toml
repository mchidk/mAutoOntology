[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mautoontology"
version = "1.0.0"
description = "Auto-build a governed, evidence-backed semantic layer (ontology-as-code) over dbt, Snowflake, Databricks and any SQL warehouse, and check agent SQL against it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Christensen" }]
keywords = ["ontology", "semantic-layer", "text-to-sql", "dbt", "snowflake", "databricks", "agent-skill", "sqlglot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]
dependencies = [
    "ruamel.yaml>=0.18,<0.20",
    "sqlglot>=30,<31",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]
dev = ["pytest>=8", "duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/mchidk/mAutoOntology"

[project.scripts]
mautoontology = "mautoontology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mautoontology = ["schema/*.json", "skill/*.md", "skill/references/*.md"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM102", "SIM108", "SIM118", "B017", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
