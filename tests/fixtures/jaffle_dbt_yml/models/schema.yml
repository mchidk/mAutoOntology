version: 2

models:
  - name: customers
    description: One row per customer.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: first_name
  - name: orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: [placed, shipped, completed, returned]
